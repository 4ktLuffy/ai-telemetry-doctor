[project]
name = "aidoctor"
version = "0.1.0"
description = "Independent checker for the AI telemetry that Sentry's Python SDK produces (tokens, errors, privacy, size limits)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Henos" }]
keywords = ["sentry", "sentry-sdk", "llm", "telemetry", "openai", "anthropic", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["sentry-sdk>=2.0"]

[project.urls]
Homepage = "https://github.com/4ktLuffy/ai-telemetry-doctor"
Repository = "https://github.com/4ktLuffy/ai-telemetry-doctor"

[project.optional-dependencies]
openai = ["openai"]
anthropic = ["anthropic"]
mcp = ["mcp"]
all = ["openai", "anthropic", "mcp"]
test = ["pytest", "openai", "anthropic", "mcp"]

[project.scripts]
aidoctor = "aidoctor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aidoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
